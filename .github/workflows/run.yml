name: Update xiaosa and aowu

on:
  workflow_dispatch:

  schedule:
    - cron: "20 5 * * *"

  push:
    branches:
      - master
    paths:
      - "tools/**"
      - ".github/workflows/run.yml"


jobs:

  build-and-push:
    name: Build xiaosa and AOWU
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      # ==========================================================
      # Checkout
      # ==========================================================

      - name: Checkout the branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0


      # ==========================================================
      # 安装 Python 依赖
      # ==========================================================

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip

          pip install \
            demjson3 \
            pycryptodome \
            requests \
            --break-system-packages


      # ==========================================================
      # Xiaosa
      # ==========================================================

      - name: Build xiaosa
        shell: bash
        run: |

          set -e

          echo "=========================================="
          echo "开始构建 Xiaosa"
          echo "=========================================="

          cd tools

          # ------------------------------------------------------
          # 解密 Xiaosa 配置
          # ------------------------------------------------------

          echo "正在获取 Xiaosa 配置..."

          python tvbox.py \
            https://9877.kstore.space/sun.json \
            xs.json \
            dec

          # ------------------------------------------------------
          # 构建本地资源
          # ------------------------------------------------------

          echo ""
          echo "开始下载本地资源..."

          rm -rf output

          python build_local.py \
            xs.json \
            output

          # ------------------------------------------------------
          # 检查 output
          # ------------------------------------------------------

          echo ""
          echo "=========================================="
          echo "检查 output"
          echo "=========================================="

          if [ ! -d output ]; then
            echo "❌ output 目录不存在"
            exit 1
          fi

          find output -maxdepth 4 -type f -print


          # ------------------------------------------------------
          # 准备 xiaosa 目录
          # ------------------------------------------------------

          cd ..

          mkdir -p xiaosa
          mkdir -p jar

          echo ""
          echo "复制 Xiaosa 本地资源..."

          cp -a tools/output/. xiaosa/


          # ------------------------------------------------------
          # 生成 dianshi.json
          # ------------------------------------------------------

          cd tools

          echo ""
          echo "生成 dianshi.json..."

          python xiao.py \
            ./output/api.json \
            dianshi.json


          # ------------------------------------------------------
          # 生成 jsm.json
          # ------------------------------------------------------

          echo ""
          echo "生成 jsm.json..."

          python xiao.py \
            ./output/api.json \
            jsm.json


          # ------------------------------------------------------
          # 处理 xbpq
          # ------------------------------------------------------

          echo ""
          echo "处理 xbpq..."

          python copy_xbpq.py \
            ./output/api.json


          # ------------------------------------------------------
          # 复制生成的 JSON
          # ------------------------------------------------------

          echo ""
          echo "复制最终 JSON..."

          cp -f \
            dianshi_with_app_sites.json \
            ../dianshi.json

          cp -f \
            jsm_with_app_sites.json \
            ../jsm.json


          # ------------------------------------------------------
          # 复制 spider.jar
          # ------------------------------------------------------

          echo ""
          echo "复制 spider.jar..."

          if [ -f output/spider.jar ]; then

            cp -f \
              output/spider.jar \
              ../jar/spider.jar

          else

            echo "⚠️ output/spider.jar 不存在"

          fi


          # ------------------------------------------------------
          # 清理 Xiaosa 临时文件
          # ------------------------------------------------------

          rm -f \
            dianshi_with_app_sites.json \
            jsm_with_app_sites.json \
            xs.json


          cd ..

          echo ""
          echo "=========================================="
          echo "Xiaosa 构建完成"
          echo "=========================================="


      # ==========================================================
      # AOWU
      # ==========================================================

      - name: Build AOWU
        shell: bash
        run: |

          set -e

          echo "=========================================="
          echo "开始构建 AOWU"
          echo "=========================================="


          cd tools


          # ------------------------------------------------------
          # 解密 AOWU 配置
          # ------------------------------------------------------

          echo "正在获取 AOWU 配置..."

          python tvbox.py \
            http://www.英格里希嗷呜.top/tv \
            aowu.json \
            dec


          # ------------------------------------------------------
          # 清理配置
          # ------------------------------------------------------

          echo ""
          echo "开始处理 AOWU 配置..."

          python aowu.py \
            aowu.json


          # ------------------------------------------------------
          # 复制最终配置
          # ------------------------------------------------------

          if [ ! -f tvbox_cleaned.json ]; then
            echo "❌ tvbox_cleaned.json 不存在"
            exit 1
          fi

          cp -f \
            tvbox_cleaned.json \
            ../aowu.json


          cd ..


          # ======================================================
          # AOWU 本地目录
          # ======================================================

          echo ""
          echo "=========================================="
          echo "准备 AOWU 本地目录"
          echo "=========================================="


          # 删除旧版本
          rm -rf AOWU


          # ------------------------------------------------------
          # 下载仓库到 AOWU
          # ------------------------------------------------------

          git clone \
            --depth=1 \
            --recursive \
            https://github.com/F1-F/T.git \
            AOWU


          # ------------------------------------------------------
          # 删除嵌套 Git
          # ------------------------------------------------------

          rm -rf AOWU/.git


          # ------------------------------------------------------
          # 删除不需要的 fan.txt
          # ------------------------------------------------------

          find AOWU \
            -type f \
            -name "fan.txt" \
            -delete


          echo ""
          echo "=========================================="
          echo "AOWU 目录生成完成"
          echo "=========================================="


          find AOWU \
            -maxdepth 4 \
            -type f \
            -print | head -200


          # ------------------------------------------------------
          # 清理 tools 临时文件
          # ------------------------------------------------------

          rm -f \
            tools/tvbox_cleaned.json \
            tools/aowu.json


      # ==========================================================
      # 清理 fan.txt 和临时文件
      # ==========================================================

      - name: Clean temporary files
        shell: bash
        run: |

          echo "=========================================="
          echo "清理临时文件"
          echo "=========================================="


          # 不需要 fan.txt
          find . \
            -type f \
            -name "fan.txt" \
            -not -path "./.git/*" \
            -delete


          # 不需要这些构建临时文件
          rm -f \
            tools/xs.json \
            tools/aowu.json \
            tools/tvbox_cleaned.json


          echo ""
          echo "临时文件清理完成"


      # ==========================================================
      # 检查最终目录
      # ==========================================================

      - name: Check final output
        shell: bash
        run: |

          echo ""
          echo "=========================================="
          echo "最终目录检查"
          echo "=========================================="


          echo ""
          echo "---------- AOWU ----------"

          if [ -d AOWU ]; then
            echo "✅ AOWU/ 存在"

            find AOWU \
              -maxdepth 3 \
              -type f \
              -print | head -100

          else
            echo "❌ AOWU/ 不存在"
            exit 1
          fi


          echo ""
          echo "---------- xiaosa ----------"

          if [ -d xiaosa ]; then
            echo "✅ xiaosa/ 存在"

            find xiaosa \
              -maxdepth 3 \
              -type f \
              -print | head -100

          else
            echo "❌ xiaosa/ 不存在"
            exit 1
          fi


          echo ""
          echo "---------- jar ----------"

          if [ -d jar ]; then

            find jar \
              -maxdepth 2 \
              -type f \
              -print

          fi


          echo ""
          echo "---------- JSON ----------"

          ls -lah \
            *.json \
            2>/dev/null || true


          echo ""
          echo "---------- fan.txt ----------"

          if find . \
            -type f \
            -name "fan.txt" \
            -not -path "./.git/*" \
            | grep -q .; then

            echo "❌ 发现 fan.txt"
            exit 1

          else

            echo "✅ 没有 fan.txt"

          fi


      # ==========================================================
      # Git Push
      # ==========================================================

      - name: Git push
        shell: bash
        run: |

          set -e

          echo "=========================================="
          echo "准备 Git Push"
          echo "=========================================="


          git config \
            --local \
            user.name \
            "github-actions[bot]"


          git config \
            --local \
            user.email \
            "github-actions[bot]@users.noreply.github.com"


          # ------------------------------------------------------
          # 添加所有变化
          # ------------------------------------------------------

          git add -A


          echo ""
          echo "=========================================="
          echo "Git 状态"
          echo "=========================================="


          git status --short


          # ------------------------------------------------------
          # 判断是否有变化
          # ------------------------------------------------------

          if git diff --cached --quiet; then

            echo ""
            echo "没有文件更新"
            echo "不执行 git push"

            exit 0

          fi


          # ------------------------------------------------------
          # 提交
          # ------------------------------------------------------

          echo ""
          echo "正在提交..."

          git commit \
            -m "自动更新源 $(date +%Y%m%d%H%M)"


          # ------------------------------------------------------
          # Push
          # ------------------------------------------------------

          echo ""
          echo "正在推送到 master..."

          git push origin master


          echo ""
          echo "=========================================="
          echo "✅ Git Push 完成"
          echo "=========================================="
